# Nous Research — compositor surface
general {
    col.active_border = rgb(4D8FFF)
    col.inactive_border = rgba(2E4A8A88)
    border_size = 2
    gaps_in = 8
    gaps_out = 18
}

group {
    col.border_active = rgb(4D8FFF)
    col.border_inactive = rgba(2E4A8A88)
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.98
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(4D8FFF22)
        color_inactive = rgba(1E30610D)
    }
}
