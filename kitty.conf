# Nous Research — deep navy terminal.
# Surface: #1E3061. Type is white-blue; cobalt for focus and selection.

foreground              #E8EEFF
background              #1E3061
background_opacity      0.96
dynamic_background_opacity yes
selection_foreground    #FFFFFF
selection_background    #4D8FFF

cursor                  #4D8FFF
cursor_text_color       #1E3061
cursor_shape            beam
cursor_beam_thickness   2.0
cursor_underline_thickness 2.0
cursor_blink_interval   0.6 ease-in-out
cursor_stop_blinking_after 0
cursor_trail            8
cursor_trail_decay      0.06 0.20
cursor_trail_start_threshold 1
cursor_trail_color      #6BA3FF

# Tabs and panes
active_tab_foreground   #FFFFFF
active_tab_background   #4D8FFF
inactive_tab_foreground #6080C0
inactive_tab_background #243672
tab_bar_background      #182650
active_border_color     #4D8FFF
inactive_border_color   #2E4A8A
bell_border_color       #F06070
window_border_width     1pt
window_margin_width     0
inactive_text_alpha     0.78

# ANSI palette
color0  #1E3061
color1  #F06070
color2  #2EC4A0
color3  #E6B84A
color4  #4D8FFF
color5  #9BB0E8
color6  #4ECDE6
color7  #A8BDED
color8  #6080C0
color9  #F07080
color10 #3ED4B0
color11 #F0C860
color12 #6BA3FF
color13 #B0C4F0
color14 #60DCF0
color15 #E8EEFF

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
