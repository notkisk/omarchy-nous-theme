# Nous Research — Kitty
# Blue field-notes terminal: a mid-navy research panel, not black and not
# white. Pale blue type and cobalt rules echo the reference dashboard.

foreground              #DCE8FF
background              #12275E
background_opacity      0.96
dynamic_background_opacity yes
selection_foreground    #F4F7FF
selection_background    #0000F2

cursor                  #F4F7FF
cursor_text_color       #12275E
cursor_shape            beam
cursor_beam_thickness   2.0
cursor_underline_thickness 2.0
cursor_blink_interval   0.6 ease-in-out
cursor_stop_blinking_after 0
# Kitty-native motion trail: a brief cobalt trace makes the beam feel alive
# without leaving visual noise during normal typing.
cursor_trail            8
cursor_trail_decay      0.06 0.20
cursor_trail_start_threshold 1
cursor_trail_color      #9FB7FF

# Tabs and panes
active_tab_foreground   #F4F7FF
active_tab_background   #0000F2
inactive_tab_foreground #AFC0E7
inactive_tab_background #1D3977
tab_bar_background      #0D1D47
active_border_color     #0000F2
inactive_border_color   #46639A
bell_border_color       #E06C82
window_border_width     1pt
window_margin_width     0
inactive_text_alpha     0.78

# ANSI colors
color0  #12275E
color1  #C35871
color2  #5DB3A2
color3  #B8895D
color4  #6C84E8
color5  #9297E5
color6  #62B4C6
color7  #DCE8FF
color8  #46639A
color9  #EB8195
color10 #86D3BE
color11 #D9B88A
color12 #9FB7FF
color13 #BFC5FF
color14 #8BD6E5
color15 #F4F7FF

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
