# Nous Research — a small field-note prompt for shells that use Starship.
add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold #9FB7FF"
format = "[$path]($style) "
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
symbol = "⌁ "
style = "#6D83D7"
format = "[$symbol$branch]($style) "

[git_status]
style = "#B34A62"
format = "([$all_status$ahead_behind]($style)) "

[cmd_duration]
min_time = 2000
style = "#5E77AC"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #F4F7FF)"
error_symbol = "[❯](bold #B34A62)"
vimcmd_symbol = "[❮](bold #6D83D7)"
