# Nous Research — electric blue prompt. White on blue segments.
add_newline = true

format = """
$username$directory$git_branch$git_status$fill$cmd_duration$time
$character"""

[fill]
symbol = " "

[username]
show_always = true
style_user = "bg:#0000CC fg:#FFFFFF"
style_root = "bg:#0000CC fg:#FF4455"
format = "[](fg:#0000CC)[ $user ]($style)"

[directory]
style = "bg:#0000F2 fg:#FFFFFF"
format = "[](fg:#0000F2 bg:#0000CC)[ $path ]($style)"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
style = "bg:#2222CC fg:#CCDDFF"
symbol = " "
format = "[](fg:#2222CC bg:#0000F2)[ $symbol$branch ]($style)"

[git_status]
style = "bg:#0000CC fg:#8888FF"
format = "[](fg:#0000CC bg:#2222CC)[ $all_status$ahead_behind ]($style)[](fg:#0000CC)"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "~"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
style = "fg:#8888FF"
format = "[$duration]($style) "
min_time = 2000

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#CCDDFF"
format = "[✦ $time]($style)"

[character]
success_symbol = "[❯](bold #FFFFFF)"
error_symbol = "[❯](bold #FF4455)"
vimcmd_symbol = "[❮](bold #8888FF)"
