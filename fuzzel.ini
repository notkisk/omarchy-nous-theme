# Fuzzel alternative launcher profile; Omarchy's default launcher is Walker.
[main]
font=JetBrainsMono Nerd Font:size=12
prompt=NOUS  
terminal=kitty
layer=overlay
width=62
lines=12
horizontal-pad=20
vertical-pad=16
inner-pad=8
line-height=24
icon-theme=Adwaita
show-actions=yes

[colors]
background=1E3061ff
text=E8EEFFff
match=4D8FFFff
selection=4D8FFFff
selection-text=FFFFFFff
selection-match=FFFFFFff
border=4D8FFFff

[border]
width=2
radius=0
