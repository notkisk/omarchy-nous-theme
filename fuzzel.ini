# Fuzzel alternative launcher profile; Omarchy's default launcher is Walker.
[main]
font=JetBrainsMono Nerd Font:size=12
prompt=NOUS  
terminal=kitty
layer=overlay
width=62
lines=12
horizontal-pad=20
vertical-pad=16
inner-pad=8
line-height=24
icon-theme=Adwaita
show-actions=yes

[colors]
background=f5f1e8f2
text=172149ff
match=0000f2ff
selection=0000f2ff
selection-text=f5f1e8ff
selection-match=f5f1e8ff
border=0000f2ff

[border]
width=2
radius=0
