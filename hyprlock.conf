# Nous Research — field-station lock screen.
#
# The shared Omarchy lock config supplies the background and password field;
# these labels give the theme its own quiet research-instrument identity.
$color       = rgba(1, 1, 9, 0.97)
$inner_color = rgba(1, 2, 136, 0.90)
$outer_color = rgba(3, 5, 246, 0.90)
$font_color  = rgba(246, 247, 255, 1.0)
$check_color = rgba(3, 5, 246, 1.0)

$font = JetBrainsMono Nerd Font

label {
    monitor =
    text = NOUS RESEARCH  /  PRIVATE FIELD STATION
    color = rgba(194, 194, 252, 0.78)
    font_size = 14
    font_family = $font Bold
    position = 0, 290
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $font_color
    font_size = 108
    font_family = $font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A  /  %d %B %Y')"
    color = rgba(194, 194, 252, 0.78)
    font_size = 16
    font_family = $font
    position = 0, 125
    halign = center
    valign = center
}

label {
    monitor =
    text = AUTHENTICATE TO CONTINUE
    color = rgba(194, 194, 252, 0.78)
    font_size = 13
    font_family = $font Bold
    position = 0, -125
    halign = center
    valign = center
}

label {
    monitor =
    text = PRIVATE  /  ENCRYPTED  /  READY
    color = rgba(194, 194, 252, 0.62)
    font_size = 11
    font_family = $font
    position = 0, -205
    halign = center
    valign = center
}
