include=~/.local/share/omarchy/default/mako/core.ini

# Nous Research — paper notification cards
text-color=#12275E
border-color=#0000F2
background-color=#E8EFF9
progress-color=over #0000F2
padding=12
border-size=2
border-radius=0
font=JetBrains Mono 10
max-icon-size=36
outer-margin=18

[urgency=low]
