include=~/.local/share/omarchy/default/mako/core.ini

# Nous Research — navy notification cards
text-color=#E8EEFF
border-color=#4D8FFF
background-color=#1E3061
progress-color=over #4D8FFF
padding=12
border-size=2
border-radius=0
font=JetBrains Mono 10
max-icon-size=36
outer-margin=18

[urgency=low]
text-color=#6080C0
border-color=#2E4A8A

[urgency=normal]
text-color=#E8EEFF
border-color=#4D8FFF

[urgency=critical]
text-color=#FFFFFF
border-color=#F06070
background-color=#3A1E2A
